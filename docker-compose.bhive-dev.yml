services:
  bhive-backend-dev:
    build: .
    container_name: bhive-backend-dev
    restart: unless-stopped
    ports:
      - "8084:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      AWS_REGION: ap-south-1
      SERVER_FORWARD_HEADERS_STRATEGY: framework
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

spring.application.name=bhive-platform
server.port=8080
spring.profiles.active=dev

# DataSource

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging
logging.level.org.hibernate.SQL=ERROR
logging.level.org.hibernate.orm.jdbc.bind=ERROR
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=ERROR
logging.level.org.springframework.jcl=OFF

# HikariCP tuning
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.keepalive-time=10000
spring.datasource.hikari.max-lifetime=1800000

# App config
spring.web.cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://localhost:5180,http://13.233.126.174:3004
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Optional app flags
app.db.seed=false
app.security.jwt.secret=${BHIVE_JWT_SECRET:change-this-local-development-secret-before-deploy}
app.security.refresh-cookie.secure=false
aws.region=${AWS_REGION:}
app.db.secret-id=

# API Setu configuration
app.apisetu.base-url=${APISETU_BASE_URL:https://sandbox.api-setu.in}
app.apisetu.api-key=${APISETU_API_KEY}
app.apisetu.client-id=${APISETU_CLIENT_ID}

# Shared provider catalog used by all Spring profiles.
# Confirmed request contracts: KSEB, UPPCL, ULB_UP.
# Pending live verification and review: GUVNL, PSPCL, JKPDD, NBPDCL, BSESDELHI, MPWZ, GOAONLINE, KIADB.
app.apisetu.providers.KSEB.endpoint=/certificate/v3/kseb/elebl
app.apisetu.providers.KSEB.http-method=POST
app.apisetu.providers.KSEB.request-format=JSON
app.apisetu.providers.KSEB.response-format=JSON
app.apisetu.providers.KSEB.content-type=application/json
app.apisetu.providers.KSEB.accept=application/json
app.apisetu.providers.KSEB.request-template.txnId={{txnId}}
app.apisetu.providers.KSEB.request-template.format=xml
app.apisetu.providers.KSEB.request-template.certificateParameters.ConsumerNo={{input.ConsumerNo}}
app.apisetu.providers.KSEB.request-template.consentArtifact={{consentArtifact}}


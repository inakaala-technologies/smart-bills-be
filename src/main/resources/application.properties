spring.application.name=bhive-platform
server.port=8080
spring.profiles.active=dev

# DataSource

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging
logging.level.org.hibernate.SQL=ERROR
logging.level.org.hibernate.orm.jdbc.bind=ERROR
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=ERROR
logging.level.org.springframework.jcl=OFF

# HikariCP tuning
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.keepalive-time=10000
spring.datasource.hikari.max-lifetime=1800000

# App config
spring.web.cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://localhost:5180
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Optional app flags
app.db.seed=false
app.security.jwt.secret=${BHIVE_JWT_SECRET:change-this-local-development-secret-before-deploy}
app.security.refresh-cookie.secure=false
aws.region=${AWS_REGION:}
app.db.secret-id=

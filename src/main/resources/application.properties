spring.application.name=bhive-platform
server.port=8080
spring.profiles.active=dev

# DataSource

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update

# Saved electricity and water bill polling
app.bills.fetch.interval-hours=${BILL_FETCH_INTERVAL_HOURS:24}
app.bills.fetch.scheduler-delay-ms=${BILL_FETCH_SCHEDULER_DELAY_MS:60000}
app.bills.fetch.batch-size=${BILL_FETCH_BATCH_SIZE:10}
app.bills.fetch.stale-claim-minutes=${BILL_FETCH_STALE_CLAIM_MINUTES:15}
app.bills.fetch.retry-base-delay-seconds=${BILL_FETCH_RETRY_BASE_DELAY_SECONDS:300}
app.bills.fetch.retry-max-delay-seconds=${BILL_FETCH_RETRY_MAX_DELAY_SECONDS:21600}
app.bills.fetch.max-retries=${BILL_FETCH_MAX_RETRIES:5}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging
logging.level.org.hibernate.SQL=ERROR
logging.level.org.hibernate.orm.jdbc.bind=ERROR
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=ERROR
logging.level.org.springframework.jcl=OFF

# HikariCP tuning
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.keepalive-time=10000
spring.datasource.hikari.max-lifetime=1800000

# App config
spring.web.cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://localhost:5180,http://13.233.126.174:3004
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Optional app flags
app.db.seed=false
app.security.jwt.secret=${BHIVE_JWT_SECRET:change-this-local-development-secret-before-deploy}
app.security.refresh-cookie.secure=false
aws.region=${AWS_REGION:}
app.db.secret-id=

# API Setu configuration
app.apisetu.base-url=${APISETU_BASE_URL:https://sandbox.api-setu.in}
app.apisetu.api-key=${APISETU_API_KEY}
app.apisetu.client-id=${APISETU_CLIENT_ID}

spring.application.name=bhive-platform-dev
server.port=8080
spring.jackson.time-zone=Asia/Kolkata


spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=ERROR
logging.level.org.hibernate.orm.jdbc.bind=ERROR

app.db.seed=false
app.db.secret-id=dev/bhive/db
aws.region=ap-south-1
app.receipts.allow-unverified-contact-matching=true

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB	

# Redis Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.connect-timeout=2s
spring.data.redis.timeout=2s

# Common Redis Cache TTL
app.cache.ttl=30m

# Spring Cache logs
logging.level.org.springframework.cache=TRACE

# Redis cache logs
logging.level.org.springframework.data.redis.cache=DEBUG


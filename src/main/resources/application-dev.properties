spring.application.name=bhive-platform-dev
server.port=8080


spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

app.db.seed=false
app.db.secret-id=dev/bhive/db
aws.region=ap-south-1

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB	

# API Setu configuration
app.apisetu.base-url=${APISETU_BASE_URL:https://sandbox.api-setu.in}
app.apisetu.api-key=${APISETU_API_KEY}
app.apisetu.client-id=${APISETU_CLIENT_ID}

